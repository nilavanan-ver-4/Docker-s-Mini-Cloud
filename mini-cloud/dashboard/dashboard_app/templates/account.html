<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c;
            color: #e2e8f0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #2d3748;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        input {
            background-color: #4a5568;
            color: #e2e8f0;
            border: 1px solid #4a5568;
        }
        input:focus {
            border-color: #4299e1;
            outline: none;
        }
        button {
            transition: background-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-2xl font-bold mb-6 text-center">Account Management</h2>

        <div id="login-form-container">
            <h3 class="text-xl font-bold mb-4">Login</h3>
            <div id="login-message" class="mb-4 text-red-500"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="login-email" class="block text-gray-400">Email:</label>
                    <input type="email" id="login-email" class="w-full p-2 rounded-md" required>
                </div>
                <div>
                    <label for="login-password" class="block text-gray-400">Password:</label>
                    <input type="password" id="login-password" class="w-full p-2 rounded-md" required>
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">Login</button>
            </form>
        </div>

        <div id="signup-form-container" style="display: none;">
            <h3 class="text-xl font-bold mb-4">Sign Up</h3>
            <div id="signup-message" class="mb-4 text-red-500"></div>
            <form id="signup-form" class="space-y-4">
                <div>
                    <label for="signup-username" class="block text-gray-400">Username:</label>
                    <input type="text" id="signup-username" class="w-full p-2 rounded-md" required>
                </div>
                <div>
                    <label for="signup-email" class="block text-gray-400">Email:</label>
                    <input type="email" id="signup-email" class="w-full p-2 rounded-md" required>
                </div>
                <div>
                    <label for="signup-password" class="block text-gray-400">Password:</label>
                    <input type="password" id="signup-password" class="w-full p-2 rounded-md" required>
                </div>
                <button type="submit" class="w-full px-4 py-2 bg-green-500 text-white rounded-md hover:bg-green-600">Sign Up</button>
            </form>
        </div>

        <div id="logged-in-content" style="display: none;">
            <h3 class="text-xl font-bold mb-4">Welcome, <span id="logged-in-username"></span>!</h3>
            <p class="text-gray-300 mb-4">You are currently logged in.</p>
            <button id="logout-button" class="w-full px-4 py-2 bg-red-500 text-white rounded-md hover:bg-red-600">Logout</button>
            <p class="mt-4 text-center"><a href="/" class="text-blue-400 hover:underline">Go to Dashboard</a></p>
        </div>
    </div>

    <script>
        const loginFormContainer = document.getElementById('login-form-container');
        const signupFormContainer = document.getElementById('signup-form-container');
        const loggedInContent = document.getElementById('logged-in-content');
        const loggedInUsernameSpan = document.getElementById('logged-in-username');
        const loginMessage = document.getElementById('login-message');
        const signupMessage = document.getElementById('signup-message');

        const loginForm = document.getElementById('login-form');
        const loginEmailInput = document.getElementById('login-email');
        const loginPasswordInput = document.getElementById('login-password');

        const signupForm = document.getElementById('signup-form');
        const signupUsernameInput = document.getElementById('signup-username');
        const signupEmailInput = document.getElementById('signup-email');
        const signupPasswordInput = document.getElementById('signup-password');

        const logoutButton = document.getElementById('logout-button');

        function updateUI() {
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            const username = localStorage.getItem('username');
            const hash = window.location.hash;

            if (isLoggedIn) {
                loggedInContent.style.display = 'block';
                loggedInUsernameSpan.textContent = username;
                loginFormContainer.style.display = 'none';
                signupFormContainer.style.display = 'none';
            } else if (hash === '#signup') {
                signupFormContainer.style.display = 'block';
                loginFormContainer.style.display = 'none';
                loggedInContent.style.display = 'none';
            } else {
                loginFormContainer.style.display = 'block';
                signupFormContainer.style.display = 'none';
                loggedInContent.style.display = 'none';
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = loginEmailInput.value;
            const password = loginPasswordInput.value;

            const response = await fetch('/api/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', data.user);
                loginMessage.textContent = '';
                updateUI(); // Re-render UI after successful login
            } else {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('username');
                loginMessage.textContent = data.message;
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = signupUsernameInput.value;
            const email = signupEmailInput.value;
            const password = signupPasswordInput.value;

            const response = await fetch('/api/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();

            if (data.success) {
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', username);
                signupMessage.textContent = '';
                alert('Account created and logged in!');
                updateUI(); // Re-render UI after successful signup
            } else {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('username');
                signupMessage.textContent = data.message;
            }
        });

        logoutButton.addEventListener('click', () => {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('username');
            updateUI(); // Re-render UI after logout
        });

        // Initial load and hash change listener
        updateUI();
        window.addEventListener('hashchange', updateUI);
    </script>
</body>
</html>
