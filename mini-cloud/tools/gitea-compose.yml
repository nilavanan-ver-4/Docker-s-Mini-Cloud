version: '3'
services:
  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    labels:
      - "mini-cloud.tool.name=Gitea"
      - "mini-cloud.tool.description=Lightweight Git hosting"
      - "mini-cloud.tool.category=Developer Tools"
      - "mini-cloud.tool.port=3000"
volumes:
  gitea-data:
