version: '3'
services:
  netdata:
    image: netdata/netdata
    container_name: netdata
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    labels:
      - "mini-cloud.tool.name=Netdata"
      - "mini-cloud.tool.description=System metrics dashboard"
      - "mini-cloud.tool.category=Monitoring & Analytics"
      - "mini-cloud.tool.port=19999"
