version: '3'
services:
  uptime-kuma:
    image: louislam/uptime-kuma
    container_name: uptime-kuma
    ports:
      - "3002:3001"
    volumes:
      - uptime-kuma-data:/app/data
    labels:
      - "mini-cloud.tool.name=Uptime Kuma"
      - "mini-cloud.tool.description=Self-hosted uptime monitor"
      - "mini-cloud.tool.category=Monitoring & Analytics"
      - "mini-cloud.tool.port=3002"
volumes:
  uptime-kuma-data:
